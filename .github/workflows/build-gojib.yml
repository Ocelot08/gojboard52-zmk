name: Build Gojiboard52

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:4.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache west modules
        uses: actions/cache@v6
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('app/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
        continue-on-error: true

      - name: Initialize workspace (west init)
        run: west init -l app

      - name: Update modules (west update)
        run: west update --fetch-opt=--filter=tree:0

      - name: Export Zephyr CMake package (west zephyr-export)
        run: west zephyr-export

      - name: Build left half (OLED)
        run: west build -s app -d build/left_oled -b "nice_nano@2.0.0/nrf52840/zmk" -- -DSHIELD="gojboard52_left"

      - name: Build left half (nice!view)
        run: >
          west build -s app -d build/left_niceview -b "nice_nano@2.0.0/nrf52840/zmk" --
          -DSHIELD="gojboard52_left nice_view_adapter nice_view_dual"
          -DEXTRA_DTC_OVERLAY_FILE="boards/shields/gojboard52/nice_view_compat.overlay"

      - name: Build right half
        run: west build -s app -d build/right -b "nice_nano@2.0.0/nrf52840/zmk" -- -DSHIELD="gojboard52_right"

      - name: Build settings reset
        run: west build -s app -d build/settings_reset -b "nice_nano@2.0.0/nrf52840/zmk" -- -DSHIELD="settings_reset"

      - name: Collect firmware
        run: |
          mkdir -p out
          cp build/left_oled/zephyr/zmk.uf2 out/gojboard52_left_oled.uf2
          cp build/left_niceview/zephyr/zmk.uf2 out/gojboard52_left_niceview.uf2
          cp build/right/zephyr/zmk.uf2 out/gojboard52_right.uf2
          cp build/settings_reset/zephyr/zmk.uf2 out/settings_reset.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: gojboard52-firmware
          path: out/*.uf2
