# Breadboard test only — raises log verbosity for the sensor subsystem so
# the at42qt2120 driver's diagnostic LOG_INF calls are visible over the
# USB console (enabled via the zmk-usb-logging snippet at build time).
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# ZMK's own core logging is hardcoded to debug level in app/Kconfig (not
# user-overridable — Kconfig rejects attempts to set it directly or via the
# usual _WRN/_ERR choice). That means BLE central scan spam is unavoidable
# here; compensate with a bigger ring buffer and by connecting the terminal
# before resetting the board, so nothing is lost to the race instead.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
