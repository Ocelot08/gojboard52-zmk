# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y

# Deep sleep after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT of no keyboard activity -
# wakes on the next keypress via kscan0's wakeup-source devicetree property
# (gojboard52.dtsi). Requires CONFIG_PM_DEVICE so the touch sensor (and
# anything else with PM_DEVICE support) actually gets powered down for the
# duration instead of just idling.
#
# 12 hours (ZMK's default is 15 minutes): breaks during a working day stay
# awake and instant, and the keyboard only deep-sleeps when it has been
# untouched for a long stretch (overnight, or days it isn't used). While
# awake and idle it is still connected, so there is no reconnect delay.
# Same value in gojboard52_right.conf. In milliseconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=43200000
CONFIG_PM_DEVICE=y

# Show the touch-bar half's battery level alongside this half's own, since
# that side has no display of its own. Custom status screen mirrors ZMK's
# built-in one (see custom_status_screen.c) with one added widget for it.
# (The widgets this needs - ZMK_WIDGET_BATTERY_STATUS etc. - are enabled
# conditionally in Kconfig.defconfig instead of here, since they must stay
# off when nice_view is also in the build - see the comment there.)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
