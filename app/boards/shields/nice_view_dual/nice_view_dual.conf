# Enable the display (same as the stock nice!view shield)
CONFIG_ZMK_DISPLAY=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# The panel is mounted upside down in this keyboard: rotate the screen 180 degrees.
CONFIG_NICE_VIEW_DUAL_ROTATE_180=y
